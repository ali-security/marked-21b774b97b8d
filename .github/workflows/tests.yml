name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional test selector; empty runs the full suite"
        required: false
        type: string
        default: ""

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      matrix:
        # Node 8 dropped: jasmine 3.7's own lib/loader.js uses dynamic import(),
        # which Node 8 cannot parse, so the suite cannot start there at all.
        node_version: [14]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Pin registry to release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2021-05-27T16:17:12.429000Z
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test:unit -- --filter="${{ inputs.test-filter }}"
          else
            npm run test:unit
          fi
      - name: Run Spec Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test:specs -- --filter="${{ inputs.test-filter }}"
          else
            npm run test:specs
          fi
      - name: Match publish-time npm
        if: matrix.node_version == 14
        run: npm i -g npm@7.12.0
      - name: Pack tarball
        if: matrix.node_version == 14
        run: npm pack
      - name: Upload tarball
        if: matrix.node_version == 14
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: marked-2.0.6.tgz
          if-no-files-found: error
